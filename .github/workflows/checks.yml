name: Code checks

on:
  pull_request:
  push:
    branches:
      - master
      - dev

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 33306
      DB_DATABASE: eloquent_model_configs_test
      DB_USERNAME: root
      DB_PASSWORD: password
    services:
      mysql-service:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: eloquent_model_configs_test
        ports:
          - 33306:3306
        # Set health checks to wait until mysql database has started (it takes some seconds to start)
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer
      - name: Write ssh key to enable composer authentication for prive whilesmart packages
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_BACKEND_SSHKEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: Install dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist
      - name: Run migrations
        run: vendor/bin/testbench migrate
      - name: Run tests
        run: vendor/bin/testbench package:test
      - name: Run linter test
        run: composer pint:test
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
